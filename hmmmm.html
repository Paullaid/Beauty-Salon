<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Navbar with Tailwind</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
    /* Only 3 lines of custom CSS for the animation */
    .menu-toggle.active .hamburger-top {
        transform: rotate(45deg) translate(5px, 5px);
    }
    
    .menu-toggle.active .hamburger-middle {
        opacity: 0;
    }
    
    .menu-toggle.active .hamburger-bottom {
        transform: rotate(-45deg) translate(7px, -6px);
    }
</style>
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-gray-900 text-white p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <!-- Logo -->
            <a href="#" class="text-2xl font-bold text-green-400">Brand<span class="text-white">Logo</span></a>
            
            <!-- Desktop Menu -->
            <div class="hidden md:flex space-x-6">
                <a href="#" class="hover:text-green-400 transition-colors duration-300">Home</a>
                <a href="#" class="hover:text-green-400 transition-colors duration-300">About</a>
                <a href="#" class="hover:text-green-400 transition-colors duration-300">Services</a>
                <a href="#" class="hover:text-green-400 transition-colors duration-300">Portfolio</a>
                <a href="#" class="hover:text-green-400 transition-colors duration-300">Contact</a>
            </div>
            
            <!-- Mobile Menu Button -->
            <button id="menuToggle" class="menu-toggle md:hidden focus:outline-none focus:ring-2 focus:ring-green-400 rounded p-1">
                <span class="block w-6 h-0.5 bg-white mb-1.5 transition-all duration-300 hamburger-top"></span>
                <span class="block w-6 h-0.5 bg-white mb-1.5 transition-all duration-300 hamburger-middle"></span>
                <span class="block w-6 h-0.5 bg-white transition-all duration-300 hamburger-bottom"></span>
            </button>
        </div>
        
        <!-- Mobile Menu Items -->
        <div id="mobileMenu" class="md:hidden overflow-hidden transition-all duration-300 ease-in-out max-h-0">
            <div class="px-4 py-3 space-y-3 bg-gray-800 rounded-b-lg mt-2">
                <a href="#" class="block py-2 hover:text-green-400 hover:bg-gray-700 px-3 rounded transition-colors duration-300">Home</a>
                <a href="#" class="block py-2 hover:text-green-400 hover:bg-gray-700 px-3 rounded transition-colors duration-300">About</a>
                <a href="#" class="block py-2 hover:text-green-400 hover:bg-gray-700 px-3 rounded transition-colors duration-300">Services</a>
                <a href="#" class="block py-2 hover:text-green-400 hover:bg-gray-700 px-3 rounded transition-colors duration-300">Portfolio</a>
                <a href="#" class="block py-2 hover:text-green-400 hover:bg-gray-700 px-3 rounded transition-colors duration-300">Contact</a>
            </div>
        </div>
    </nav>

    

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const menuToggle = document.getElementById('menuToggle');
            const mobileMenu = document.getElementById('mobileMenu');
            
            menuToggle.addEventListener('click', function() {
                // Toggle active class for hamburger animation
                this.classList.toggle('active');
                
                // Toggle mobile menu visibility with smooth animation
                if (mobileMenu.classList.contains('max-h-0')) {
                    mobileMenu.classList.remove('max-h-0');
                    mobileMenu.classList.add('max-h-64'); // Adjust this value based on your menu height
                } else {
                    mobileMenu.classList.remove('max-h-64');
                    mobileMenu.classList.add('max-h-0');
                }
            });
            
            // Close menu when clicking on a link
            document.querySelectorAll('#mobileMenu a').forEach(link => {
                link.addEventListener('click', () => {
                    menuToggle.classList.remove('active');
                    mobileMenu.classList.remove('max-h-64');
                    mobileMenu.classList.add('max-h-0');
                });
            });
            
            // Optional: Close menu when clicking outside
            document.addEventListener('click', function(event) {
                if (!menuToggle.contains(event.target) && !mobileMenu.contains(event.target)) {
                    if (menuToggle.classList.contains('active')) {
                        menuToggle.classList.remove('active');
                        mobileMenu.classList.remove('max-h-64');
                        mobileMenu.classList.add('max-h-0');
                    }
                }
            });
        });
    </script>
</body>
</html>
